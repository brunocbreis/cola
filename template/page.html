<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
{{FAVICON}}
<!-- Generated by build.mjs from content/*.md — edit the markdown, not this file. -->
<style>
  :root{
    --bg:#000; --well:#111112; --separator:#242426;
    --primary:#f2f2f4; --secondary:#a0a0a6; --tertiary:#6a6a70; --quaternary:#48484e;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    --r:10px; --bar:44px; --row:66px; --gap:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased}
  body{background:var(--bg);color:var(--primary);font-family:var(--sans);font-size:15px;line-height:1.5}
  .tnum{font-variant-numeric:tabular-nums}

  .deck{height:100vh;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;
        -webkit-overflow-scrolling:touch}
  .deck::-webkit-scrollbar{width:0}
  .screen{min-height:100vh;min-height:100dvh;scroll-snap-align:center;display:flex;align-items:center;
          padding:64px 28px calc(var(--bar) + 48px)}
  .in{max-width:620px;margin:0 auto;width:100%}

  /* Copy marked [touch] or [desktop] in the markdown. A touch-primary device is one that
     cannot hover and has a coarse pointer, which is the standard test for a finger. */
  @media (hover:none) and (pointer:coarse){ .only-desktop{display:none} }
  @media not all and (hover:none) and (pointer:coarse){ .only-touch{display:none} }

  .no{font-size:11px;font-weight:590;color:var(--quaternary);letter-spacing:.09em;
      text-transform:uppercase;margin-bottom:24px}
  h1{font-size:30px;line-height:1.22;letter-spacing:-.025em;font-weight:590;max-width:19em;
     text-wrap:balance}
  h1 em{font-style:normal;color:var(--tertiary)}
  h2{font-size:22px;line-height:1.25;letter-spacing:-.02em;font-weight:590;margin-bottom:8px;
     text-wrap:balance}
  p.say{color:var(--secondary);max-width:34em;text-wrap:pretty}
  p.say + p.say{margin-top:14px}
  p.note{color:var(--tertiary);font-size:13px;max-width:38em;margin-top:20px;text-wrap:pretty}

  .mark{display:flex;align-items:center;gap:14px;margin-bottom:44px}
  .glyph{width:21px;height:21px;border:1px solid var(--primary);border-radius:6px;
         display:grid;place-items:center;font-size:11px;font-weight:700}
  /* app icons ship with the macOS squircle and its padding already in the bitmap,
     so this adds no shape of its own */
  .icon{width:66px;height:66px;display:block;flex:none;
        image-rendering:-webkit-optimize-contrast}
  .wm{display:flex;flex-direction:column;gap:1px}
  .mark b{font-size:15px;font-weight:590;letter-spacing:-.01em}
  .mark span{font-size:13px;color:var(--quaternary)}
  @media (max-width:560px){ .icon{width:56px;height:56px} }
  .hero-say{margin-top:20px}

  .crumb{font-size:13px;color:var(--tertiary);margin-bottom:12px;height:20px}
  .crumb i{font-style:normal;color:var(--quaternary)}
  /* One tab per way of grouping. Selected reads at full brightness against a well; the
     rest sit at tertiary, which is the same contrast-only hierarchy the app uses. */
  .tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
  .tab{appearance:none;font:inherit;font-size:12px;font-weight:590;letter-spacing:.01em;
       color:var(--tertiary);background:none;border:1px solid transparent;border-radius:7px;
       padding:5px 10px;cursor:default;white-space:nowrap;
       transition:color .14s,background-color .14s,border-color .14s}
  .tab:hover{color:var(--secondary)}
  .tab[aria-selected=true]{color:var(--primary);background:var(--well);border-color:var(--separator)}
  .tab:focus-visible{outline:none;border-color:var(--secondary)}
  .scap{font-size:13px;color:var(--tertiary);margin-bottom:14px;text-wrap:pretty;max-width:52em}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .block{display:flex;flex-direction:column;gap:8px;border:1px solid var(--separator);
         border-radius:var(--r);padding:12px;transition:background .12s,border-color .12s}
  .block.sel{border-color:var(--secondary);background:var(--well)}
  .r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
  .nm{display:flex;align-items:center;gap:7px;min-width:0}
  .nm b{font-weight:510;letter-spacing:-.006em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .tag{flex:none;font-size:9px;font-weight:700;letter-spacing:.07em;color:var(--tertiary);
       border:1px solid var(--separator);border-radius:4px;padding:1px 5px}
  .pct{flex:none;font-weight:590}
  .pct i{font-style:normal;color:var(--tertiary)}
  .fill{height:4px;border-radius:99px;background:var(--well);overflow:hidden}
  .fill i{display:block;height:100%;background:var(--primary);transition:width .2s}
  .fill i.over{background:var(--tertiary)}
  .r3{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:13px;min-width:0}
  .r3 .pv{color:var(--tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .r3 .vl{flex:none}
  .foot{margin-top:13px;font-size:13px;color:var(--quaternary);display:flex;justify-content:space-between}
  /* Screen 4's illustration: the app's run-log dialog at the width it actually is (390px),
     dimmed and fading out at the bottom. It is a picture of the app, not a table to read —
     nothing in it is primary, no total is bold, and the lower rows dissolve so the eye
     leaves before it starts adding up. aria-hidden for the same reason. */
  /* Screen 4's illustration: the app's run-log dialog at the width it really is (390px),
     above the eyebrow. Its top edge is solid and it dissolves the whole way down.
     The words start close under the last row: by then the mask has taken the panel to a
     tenth of its strength, so the two do not compete, and the nearness is what makes the
     fade read as deliberate. Layered above the panel, so a line of text is never behind a
     row whatever the order count. */
  [data-screen=buying] .in{display:flex;flex-direction:column}
  [data-screen=buying] .in > :not(.ledger){position:relative;z-index:1}
  [data-screen=buying] .ledger{order:-1}
  .ledger{width:390px;max-width:100%;margin:0 0 10px;
          border:1px solid var(--separator);border-radius:12px;background:var(--well);
          padding:11px 12px 0;pointer-events:none;opacity:.72;
          /* Pixel stops, not percentages: the fade is a distance from the top edge, so the
             first rows stay legible whether the run has one order or six. */
          -webkit-mask-image:linear-gradient(#000 60px,rgba(0,0,0,.55) 120px,transparent 200px);
                  mask-image:linear-gradient(#000 60px,rgba(0,0,0,.55) 120px,transparent 200px)}
  .lband{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--quaternary);
         border-bottom:1px solid var(--separator);padding-bottom:8px}
  .lband b{color:var(--secondary);font-weight:510;font-size:11px}
  .lband .lright{margin-left:auto;white-space:nowrap}
  #rlrows{display:flex;flex-direction:column;gap:1px;padding:5px 0 0}
  .lrow{display:flex;align-items:baseline;gap:9px;border-radius:7px;padding:5px 6px;font-size:11px;
        color:var(--tertiary)}
  .lrow .ls{width:44px;flex:none;color:var(--secondary);font-weight:510;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .lm{flex:1;min-width:0;display:flex;align-items:baseline;gap:5px;overflow:hidden}
  .lrow .lm em{font-style:normal;color:var(--quaternary);overflow:hidden;
               text-overflow:ellipsis;white-space:nowrap}
  .lrow .lt{flex:none;color:var(--secondary)}
  /* The mask handles the recession down the panel; rows are left alone. */
  .lfoot{display:none}       /* a total invites arithmetic; the picture does not need one */

  .widget{margin-top:28px}
  .prompt{display:flex;align-items:center;gap:9px;margin-bottom:14px;font-size:12px;
          color:var(--quaternary);height:22px}
  .prompt kbd{font-size:11px;padding:1px 6px}
  .widget.on .prompt{color:var(--tertiary)}
  .widget.on .prompt kbd{color:var(--primary);border-color:var(--tertiary)}
  /* dormant until taken over, so activating it is visible */
  .wbody{transition:opacity .18s}
  .widget:not(.on) .wbody{opacity:.62}
  @keyframes nudge{0%,100%{opacity:.4}50%{opacity:1}}
  .prompt.pulse kbd{animation:nudge 1.15s ease-in-out 3}
  @media (prefers-reduced-motion:reduce){.prompt.pulse kbd{animation:none}}

  .amt{border:1px solid var(--separator);border-radius:var(--r);padding:14px;margin-bottom:8px;
       display:flex;align-items:baseline;gap:10px}
  .amt label{font-size:12px;color:var(--quaternary);text-transform:uppercase;letter-spacing:.09em;flex:1}
  .amt .val{display:flex;align-items:baseline;gap:.28em}
  .amt .val.tight{gap:0}
  .amt input{background:none;border:0;color:var(--primary);font-family:var(--sans);
             font-size:26px;font-weight:590;letter-spacing:-.02em;text-align:right;width:5ch;
             font-variant-numeric:tabular-nums;outline:none;padding:0}
  .amt .cur{font-size:26px;font-weight:590;color:var(--tertiary);white-space:nowrap}
  .amt.focus{border-color:var(--secondary);background:var(--well)}

  .lim{display:flex;align-items:center;gap:12px;margin:14px 0 18px;font-size:13px;color:var(--tertiary)}
  .lim .track{flex:1;height:4px;background:var(--well);border-radius:99px;position:relative;
              cursor:default;touch-action:none;outline:none}
  /* the bar is 4px; this gives it a 30px hit area so the pointer can actually land on it */
  .lim .track::before{content:"";position:absolute;inset:-13px 0;border-radius:99px}
  .lim .track i{position:absolute;inset:0 auto 0 0;background:var(--tertiary);border-radius:99px;transition:width .12s}
  .lim .track s{position:absolute;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
                background:var(--separator);border-radius:50%;text-decoration:none}
  .lim .track u{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
                background:var(--primary);border-radius:50%;transition:left .12s,box-shadow .12s}
  .lim .track.drag i,.lim .track.drag u{transition:none}
  .lim .track:focus-visible u,.lim .track.drag u{box-shadow:0 0 0 4px rgba(242,242,244,.16)}
  .lim b{font-weight:510;color:var(--secondary);width:74px;flex:none}

  #orders{transition:none}
  .card{display:flex;align-items:center;gap:14px;border:1px solid var(--separator);
        border-radius:var(--r);padding:0 13px;margin-bottom:var(--gap);
        height:var(--row);box-sizing:border-box}
  .card .a{font-size:18px;font-weight:590;letter-spacing:-.015em;width:86px;flex:none}
  .card .w{min-width:0;flex:1}
  .card .w b{display:block;font-weight:510;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .w span{display:block;font-size:13px;color:var(--tertiary);overflow:hidden;
                text-overflow:ellipsis;white-space:nowrap}
  .card .g{flex:none;font-size:13px;color:var(--tertiary)}
  .skip{display:flex;align-items:center;gap:14px;padding:0 13px;border:1px dashed var(--separator);
        border-radius:var(--r);color:var(--tertiary);margin-bottom:var(--gap);
        height:var(--row);box-sizing:border-box}
  .skip .a{width:86px;flex:none;font-size:13px}
  .skip b{font-weight:510;color:var(--secondary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .skip span{font-size:13px;flex:none}
  .tot{font-size:13px;color:var(--quaternary);display:flex;justify-content:space-between;margin-top:12px}

  .keys{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:baseline;margin-top:24px}
  .keys p{color:var(--secondary);font-size:14px;text-wrap:pretty}
  kbd{font-family:var(--sans);font-size:12px;font-weight:590;color:var(--secondary);background:var(--well);
      border:1px solid var(--separator);border-radius:5px;padding:2px 7px;white-space:nowrap;justify-self:start}

  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#000;
       text-decoration:none;font-size:14px;font-weight:590;padding:9px 17px;border-radius:8px;
       margin-top:32px;transition:transform .1s,opacity .15s}
  .btn:active{transform:scale(.98)}
  .btn[aria-disabled=true]{background:var(--well);color:var(--tertiary);border:1px solid var(--separator);cursor:default}
  .btn svg{width:12px;height:12px}
  .req{font-size:13px;color:var(--quaternary);margin-top:14px}

  .bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);background:rgba(0,0,0,.82);
       backdrop-filter:blur(12px);border-top:1px solid var(--separator);display:flex;
       align-items:center;gap:18px;padding:0 28px;font-size:12px;color:var(--quaternary);z-index:9}
  .hints{display:flex;gap:16px;flex:1;overflow:hidden;white-space:nowrap}
  .hint{display:flex;align-items:center;gap:6px}
  .hint u{text-decoration:none;font-weight:590;color:var(--tertiary)}
  .count{flex:none;font-variant-numeric:tabular-nums}

  @media (max-width:560px){
    .screen{padding:52px 20px calc(var(--bar) + 40px)}
    h1{font-size:25px} h2{font-size:20px}
    .grid{grid-template-columns:minmax(0,1fr)}
    .card .a,.skip .a{width:72px}
    .hints .opt{display:none}
  }


  /* A wide window should be used. The measure of running prose stays put — that is a
     reading limit, not a space one — while the grid and the plan take the room going. */
  @media (min-width:1000px){
    body{font-size:16px}
    .in{max-width:820px}
    h1{font-size:36px}
    h2{font-size:26px}
    .no{font-size:12px}
    p.note{font-size:14px}
  }
  @media (min-width:1400px){
    .in{max-width:960px}
    h1{font-size:40px}
  }


  /* ══ still ══ desktop only, from `motion` in site.md or ?motion= in the URL ══
     Every rule here is a class on <html>, so it outranks the width breakpoints and the
     touch layer below on specificity and does not depend on sitting after them. The
     dimmed and filled states stay; only the travel between states goes. */
  html.still *,html.still *::before,html.still *::after{
    transition:none !important;animation:none !important}
  html.still .btn:active{transform:none}

  /* ══ touch layer ══ last in the sheet, so the width breakpoints above cannot undo it ══ */

  /* Touch: one screen per swipe, same as one arrow press per screen. A screen taller than
     the viewport stays scrollable inside itself, since an oversized snap area accepts every
     position that covers the viewport. */
  @media (hover:none) and (pointer:coarse){
    .deck{overscroll-behavior-y:contain}
    /* one swipe moves one screen, however hard it is flicked */
    /* A screen taller than the phone reads from its top edge and scrolls within itself;
       centring it would leave both ends out of reach. */
    .screen{padding:36px 20px calc(var(--bar) + 24px);scroll-snap-align:start;scroll-snap-stop:always}
    .back{appearance:none;background:none;border:0;padding:0 6px 0 0;margin:0;font:inherit;
          color:var(--secondary);cursor:default}
    .block{padding:12px 12px}          /* roomier tap targets, without spending the screen */
    .grid{gap:6px}
    /* the plan is the tallest screen, so its rows tighten up to stay in one view */
    :root{--row:52px}
    .amt{padding:12px}
    .amt input,.amt .cur{font-size:23px}
    .lim{margin:12px 0 14px}
    .ledger{width:100%;margin-bottom:8px}
    /* every widget is live here, so it should never render dimmed even for one frame */
    .widget .wbody{opacity:1}
    .prompt{color:var(--tertiary)}
    .prompt kbd{color:var(--primary);border-color:var(--tertiary)}
  }

  /* A phone with its address bar showing has some 660px to work with, and the two widget
     screens are the tall ones. Everything gives a little so a screen stays a screen. */
  @media (hover:none) and (pointer:coarse) and (max-height:760px){
    :root{--row:46px}
    .tabs{margin-bottom:8px}
    .tab{padding:4px 9px}
    .scap{font-size:12px;margin-bottom:10px;min-height:0}
    .screen{padding:28px 20px calc(var(--bar) + 18px)}
    h1{font-size:26px}
    h2{font-size:20px}
    p.note{margin-top:14px;font-size:12px}
    .mark{margin-bottom:30px}
    .no{margin-bottom:16px}
    .widget{margin-top:18px}
    .amt input,.amt .cur{font-size:21px}
    .amt{padding:10px}
    .lim{margin:10px 0 12px}
    .icon{width:54px;height:54px}
    .keys{margin-top:18px;gap:8px 14px}
  }

</style>
</head>
<script>
/* Set before the first frame so nothing animates on the way in. Desktop only: a finger
   keeps its momentum scrolling and its snap. */
(function(){
  var q = /[?&]motion=(on|off)/i.exec(location.search);
  var on = q ? q[1].toLowerCase() === "on" : null;
  var coarse = window.matchMedia("(hover:none) and (pointer:coarse)").matches;
  window.__MOTION = on;                      /* null = take it from the build config */
  var m = /[?&]ms=(\d{1,4})/.exec(location.search);
  window.__MS = m ? +m[1] : null;             /* screen-change duration, for dialling it in */
  if(on === false && !coarse) document.documentElement.className += " still";
})();
</script>

<div class="deck" id="deck">
{{SCREENS}}
</div>

<div class="bar">
  <div class="hints" id="hints"></div>
  <div class="count" id="count"></div>
</div>

<script>window.COLA = {{DATA}};</script>
<script>
(function(){
  "use strict";
  var C = window.COLA;

  /* ---------- the reader's own money and notation ----------
     Cola takes its base currency from the system it runs on, so the page does the same:
     the figures below are read in the currency and notation the reader keeps at home.
     Amounts are an example either way, and an example is easiest to judge in the units
     you already think in. */
  var REGION_CURRENCY = {
    AD:"EUR",AT:"EUR",BE:"EUR",CY:"EUR",DE:"EUR",EE:"EUR",ES:"EUR",FI:"EUR",FR:"EUR",
    GR:"EUR",HR:"EUR",IE:"EUR",IT:"EUR",LT:"EUR",LU:"EUR",LV:"EUR",MC:"EUR",ME:"EUR",
    MT:"EUR",NL:"EUR",PT:"EUR",SI:"EUR",SK:"EUR",SM:"EUR",VA:"EUR",XK:"EUR",
    US:"USD",EC:"USD",SV:"USD",PA:"USD",PR:"USD",GU:"USD",TL:"USD",ZW:"USD",
    BR:"BRL",GB:"GBP",CH:"CHF",LI:"CHF",JP:"JPY",CN:"CNY",IN:"INR",CA:"CAD",
    AU:"AUD",NZ:"NZD",MX:"MXN",AR:"ARS",CL:"CLP",CO:"COP",PE:"PEN",UY:"UYU",
    PY:"PYG",BO:"BOB",VE:"VES",CR:"CRC",GT:"GTQ",DO:"DOP",HN:"HNL",NI:"NIO",
    ZA:"ZAR",NG:"NGN",KE:"KES",GH:"GHS",TZ:"TZS",UG:"UGX",ET:"ETB",EG:"EGP",
    MA:"MAD",DZ:"DZD",TN:"TND",TR:"TRY",RU:"RUB",UA:"UAH",BY:"BYN",KZ:"KZT",
    PL:"PLN",CZ:"CZK",HU:"HUF",RO:"RON",BG:"BGN",RS:"RSD",MK:"MKD",AL:"ALL",
    SE:"SEK",NO:"NOK",DK:"DKK",IS:"ISK",IL:"ILS",
    AE:"AED",SA:"SAR",QA:"QAR",KW:"KWD",BH:"BHD",OM:"OMR",JO:"JOD",LB:"LBP",IQ:"IQD",
    KR:"KRW",TW:"TWD",HK:"HKD",MO:"MOP",SG:"SGD",MY:"MYR",TH:"THB",ID:"IDR",
    PH:"PHP",VN:"VND",PK:"PKR",BD:"BDT",LK:"LKR",NP:"NPR",MM:"MMK",KH:"KHR",MN:"MNT"
  };

  function regionOf(tag){
    try{
      var loc = new Intl.Locale(tag);
      // A bare "pt" carries no region, and CLDR knows the likely one: pt→BR, fr→FR, en→US.
      return loc.region || loc.maximize().region || "";
    }catch(e){
      var m = String(tag).match(/[-_]([A-Za-z]{2})(?:[-_]|$)/);
      return m ? m[1].toUpperCase() : "";
    }
  }

  var L = C.locale, CODE = C.currency_code;
  if(C.follow_visitor){
    var tag = (navigator.languages && navigator.languages[0]) || navigator.language;
    if(tag){
      L = tag;
      CODE = REGION_CURRENCY[regionOf(tag)] || C.currency_code;
    }
  }

  // Intl turns down a currency or a locale it does not know, so each step has a way back.
  function nf(opts){
    try{ return new Intl.NumberFormat(L, opts); }
    catch(e){
      try{ return new Intl.NumberFormat(C.locale, opts); }
      catch(e2){ return new Intl.NumberFormat("en-US", {
        minimumFractionDigits: opts.minimumFractionDigits,
        maximumFractionDigits: opts.maximumFractionDigits}); }
    }
  }
  var f_money  = nf({style:"currency", currency:CODE, minimumFractionDigits:0, maximumFractionDigits:0}),
      f_price  = nf({style:"currency", currency:CODE, minimumFractionDigits:2, maximumFractionDigits:2}),
      f_shares = nf({minimumFractionDigits:1, maximumFractionDigits:1}),
      f_int    = nf({maximumFractionDigits:0}),
      f_pct1   = nf({style:"percent", minimumFractionDigits:1, maximumFractionDigits:1}),
      f_pct0   = nf({style:"percent", maximumFractionDigits:0}),
      f_pctT   = nf({style:"percent", maximumFractionDigits:1});

  // The symbol, which side of the digits it belongs on, and whether a space goes between —
  // all three are the formatter's call: $1,000 against 1 000 € against R$ 1.000.
  var SYMBOL = CODE, SYM_FIRST = false, SYM_TIGHT = true;
  try{
    var parts = f_money.formatToParts(1234), ci = -1;
    parts.forEach(function(p, i){ if(p.type === "currency"){ SYMBOL = p.value; ci = i; } });
    if(ci >= 0){
      SYM_FIRST = !parts.slice(0, ci).some(function(p){ return p.type === "integer"; });
      var next = parts[SYM_FIRST ? ci + 1 : ci - 1];
      SYM_TIGHT = !(next && next.type === "literal" && /\s|\u00a0|\u202f/.test(next.value));
    }
  }catch(e){}
  // A finger cannot press Return, so on touch every widget is live and taps do the work.
  var TOUCH = window.matchMedia("(hover:none) and (pointer:coarse)").matches;
  // Motion is on unless the build or the URL turns it off, and a finger always keeps it:
  // momentum scrolling and snap are the platform's, not the page's.
  var MOTION = TOUCH || (window.__MOTION === null ? C.motion !== false : window.__MOTION);
  if(!MOTION) document.documentElement.classList.add("still");
  // How long a screen change takes, in ms. 0 is instant. `?ms=` beats scroll_ms in
  // site.md, and a reader who has asked the system for less motion gets none.
  var SCROLL_MS = (!MOTION || window.matchMedia("(prefers-reduced-motion:reduce)").matches)
        ? 0 : (window.__MS !== null ? window.__MS : (C.scroll_ms || 330));
  var S = {}; C.screens.forEach(function(s){ S[s.id] = s; });

  function t(str, vars){
    return String(str || "").replace(/\{(\w+)\}/g, function(_, k){
      return vars[k] != null ? vars[k] : "";
    });
  }
  function money(n){  return f_money.format(n); }
  function money2(n){ return f_price.format(n); }   // a ledger states cents
  function price(n){  return f_price.format(n); }
  function shares(n){ return f_shares.format(n); }
  function pct1(n){   return f_pct1.format(n / 100); }   // takes 62.5, prints 62.5%
  function pct0(n){   return f_pct0.format(n / 100); }
  // A target as the app prints one: a decimal when it has one, none when it does not. 50 reads
  // 50%, and the third an equal group of three holds reads 33,3% rather than a rounded 33%.
  function pctT(n){   return f_pctT.format(n / 100); }

  // One strategy per tab: the same portfolio grouped a different way. Both widgets read
  // whichever is selected, so a reader sees that grouping through to the orders it produces.
  var STRATS = C.portfolios, strat = 0, tree = STRATS[0].tree;
  function val(n){ return n.children ? n.children.reduce(function(s,c){return s+val(c);},0) : n.value; }
  var total = 0;
  function retotal(){ total = tree.reduce(function(s,n){return s+val(n);},0); }
  retotal();

  /* ---------- tree widget ---------- */
  var path = [], sel = 0, TL = S.tree || {};
  function level(){ return path.length ? path[path.length-1].children : tree; }

  function gridHTML(nodes, selected){
    var sumV = nodes.reduce(function(s,n){return s+val(n);},0),
        sumW = nodes.reduce(function(s,n){return s+(n.weight||0);},0), html = "";
    nodes.forEach(function(n,i){
      var v = val(n),
          curPct = sumV ? v/sumV*100 : 0,
          tgtPct = n.weight!=null && sumW ? n.weight/sumW*100 : null,
          over = tgtPct!==null && curPct>tgtPct,
          fill = tgtPct ? Math.min(curPct/tgtPct,1)*100 : 0,
          preview = n.children ? n.children.map(function(c){return c.name;}).join(" · ")
                               : n.sym + " · " + price(n.price);
      html += '<div class="block'+(i===selected ? ' sel':'')+'" data-i="'+i+'">'
           +   '<div class="r1"><div class="nm"><b>'+n.name+'</b>'
           +     (n.shared?'<span class="tag">SHARED</span>':'')
           +     (n.equal?'<span class="tag">EQUAL</span>':'')+'</div>'
           +     '<div class="pct tnum">'+(n.weight==null ? pct1(curPct)
                  : pct1(curPct)+' <i>/ '+pctT(n.weight)+'</i>')+'</div></div>'
           +   (n.weight==null?'':'<div class="fill"><i class="'+(over?'over':'')
                  +'" style="width:'+(over?100:fill)+'%"></i></div>')
           +   '<div class="r3"><span class="pv">'+preview+'</span>'
           +     '<span class="vl tnum">'+money(v)+'</span></div></div>';
    });
    return html;
  }

  function renderTree(){
    var host = document.getElementById("tgrid"); if(!host) return;
    var nodes = level(),
        sumV = nodes.reduce(function(s,n){return s+val(n);},0),
        sumW = nodes.reduce(function(s,n){return s+(n.weight||0);},0);
    host.innerHTML = gridHTML(nodes, active === "tree" ? sel : -1);

    document.getElementById("crumb").innerHTML = path.length
      ? (TOUCH ? '<button class="back" aria-label="Back">&lsaquo;</button>' : '')
        + 'Portfolio <i>›</i> ' + path.map(function(n){return n.name;}).join(' <i>›</i> ')
      : (active === "tree" || TOUCH ? 'Portfolio' : '<i>Portfolio</i>');
    if(TOUCH && path.length){
      var b = document.getElementById("crumb").querySelector(".back");
      if(b) b.addEventListener("click", function(e){ e.stopPropagation(); up(); });
    }
    // Inside an equal group the targets are Cola's and always sum to 100, so the readout would
    // answer a question the level cannot be in. The app leaves it out there; so does this.
    var inEqual = path.length > 0 && path[path.length-1].equal;
    document.getElementById("tsum").textContent = inEqual ? ""
      : sumW ? t(TL.label_targets, {sum: pct0(Math.round(sumW))}) : (TL.label_no_targets || "");
    document.getElementById("tval").textContent = money(sumV);

    var cur = nodes[sel], note = document.getElementById("tnote");
    if(note){
      // While dormant the grid holds no selection, so a line about the selected group
      // would describe something the reader cannot see.
      var pick = function(k){ return (TOUCH && TL[k + "_touch"]) || TL[k] || ""; };
      var count = function(ns, acc){
        ns.forEach(function(n){ if(n.children){ acc.g++; count(n.children, acc); } else acc.h++; });
        return acc;
      };
      var c = count(tree, {g:0, h:0});
      note.textContent = (!TOUCH && active !== "tree")
        ? t(pick("note_dormant"), {groups: c.g, holdings: c.h})
        : cur && cur.children
          ? t(pick(cur.shared ? "note_shared" : cur.equal ? "note_equal" : "note_group"),
              {name: cur.name})
          : pick("note_leaf");
    }

    Array.prototype.forEach.call(host.querySelectorAll(".block"), function(el){
      el.addEventListener("click", function(){
        var i = +el.dataset.i;
        if(TOUCH){
          sel = i;
          if(level()[i] && level()[i].children) drill(); else renderTree();
          return;
        }
        sel = i; active = "tree"; everOn.tree = true; paint();
      });
      el.addEventListener("dblclick", drill);
    });
  }
  function drill(){ var n = level()[sel]; if(n && n.children){ path.push(n); sel = 0; renderTree(); } }
  function up(){ if(path.length){ path.pop(); sel = 0; renderTree(); } }

  /* ---------- plan widget ---------- */
  /* ---------- room kept for lines that change ----------
     The note under the grid and the caption under the tabs both change length as the
     reader moves around. The screen is centred, so a line more or less would shift
     everything above it. Each is given the height of its own longest wording, measured
     at the width it will occupy, and keeps that height whatever it currently says. */
  function reserve(el, texts){
    if(!el || !texts.length) return;
    var probe = el.cloneNode(false);
    probe.style.position = "absolute";
    probe.style.visibility = "hidden";
    probe.style.left = "-9999px";
    probe.style.top = "0";
    probe.style.minHeight = "0";
    probe.style.width = el.getBoundingClientRect().width + "px";
    el.parentNode.appendChild(probe);
    var tall = 0;
    texts.forEach(function(txt){
      probe.textContent = txt;
      tall = Math.max(tall, probe.getBoundingClientRect().height);
    });
    probe.parentNode.removeChild(probe);
    el.style.minHeight = Math.ceil(tall) + "px";
  }

  function noteCandidates(){
    var pick = function(k){ return (TOUCH && TL[k + "_touch"]) || TL[k] || ""; },
        names = [], out = [];
    (function walk(ns){
      ns.forEach(function(n){ if(n.children){ names.push(n.name); walk(n.children); } });
    })(STRATS.reduce(function(a, st){ return a.concat(st.tree); }, []));

    ["note_group", "note_shared", "note_equal"].forEach(function(k){
      var tpl = pick(k); if(!tpl) return;
      names.forEach(function(nm){ out.push(t(tpl, {name: nm})); });
    });
    if(pick("note_leaf")) out.push(pick("note_leaf"));
    if(pick("note_dormant")){
      STRATS.forEach(function(st){
        var c = {g:0, h:0};
        (function walk(ns){ ns.forEach(function(n){ n.children ? (c.g++, walk(n.children)) : c.h++; }); })(st.tree);
        out.push(t(pick("note_dormant"), {groups: c.g, holdings: c.h}));
      });
    }
    return out;
  }

  // Every level a reader can reach, across every strategy.
  function allLevels(){
    var out = [];
    STRATS.forEach(function(st){
      out.push(st.tree);
      (function walk(ns){
        ns.forEach(function(n){ if(n.children){ out.push(n.children); walk(n.children); } });
      })(st.tree);
    });
    return out;
  }

  // Drilling into a group with fewer holdings would otherwise shorten the grid and, on a
  // centred screen, pull everything above it downward. The grid keeps the height of the
  // deepest level anyone can open, measured as it would actually render.
  function reserveGrid(){
    var host = document.getElementById("tgrid"); if(!host) return;
    host.style.minHeight = "0";
    var probe = host.cloneNode(false);
    probe.removeAttribute("id");
    probe.style.position = "absolute";
    probe.style.visibility = "hidden";
    probe.style.left = "-9999px";
    probe.style.top = "0";
    probe.style.width = host.getBoundingClientRect().width + "px";
    host.parentNode.appendChild(probe);
    var tall = 0;
    allLevels().forEach(function(nodes){
      probe.innerHTML = gridHTML(nodes, -1);
      tall = Math.max(tall, probe.getBoundingClientRect().height);
    });
    probe.parentNode.removeChild(probe);
    host.style.minHeight = Math.ceil(tall) + "px";
  }

  function reserveAll(){
    reserve(document.getElementById("tnote"), noteCandidates());
    reserve(document.getElementById("scap"), STRATS.map(function(st){ return st.note || ""; }));
    reserveGrid();
    geom = null;
  }

  /* ---------- strategies ---------- */
  function renderTabs(){
    var host = document.getElementById("tabs"); if(!host) return;
    host.style.display = STRATS.length > 1 ? "" : "none";
    host.innerHTML = STRATS.map(function(st, i){
      return '<button class="tab" type="button" role="tab" data-i="' + i + '"'
           + ' aria-selected="' + (i === strat) + '">' + st.name + '</button>';
    }).join("");
    Array.prototype.forEach.call(host.querySelectorAll(".tab"), function(el){
      el.addEventListener("click", function(){ setStrategy(+el.dataset.i); });
    });
    var cap = document.getElementById("scap");
    if(cap) cap.textContent = STRATS[strat].note || "";
  }

  function setStrategy(i){
    var n = (i + STRATS.length) % STRATS.length;
    if(n === strat) return;
    strat = n; tree = STRATS[n].tree; retotal();
    path = []; sel = 0;              // a different grouping has a different top level
    renderTabs(); renderTree(); plan();
    geom = null;                     // both widget screens just changed height
    paint();                         // the note and the status bar follow the new grid
  }

  /* ---------- plan widget ---------- */
  var PL = S.plan || {}, budget = C.default_amount, limit = C.default_orders;

  function buyUnits(nodes, parentTarget, out){
    var sumW = nodes.reduce(function(s,n){return s+(n.weight||0);},0);
    nodes.forEach(function(n){
      var tg = n.weight!=null && sumW ? n.weight/sumW*parentTarget : 0, v = val(n);
      if(v >= tg) return;
      if(n.children && !n.shared) buyUnits(n.children, tg, out);
      else out.push({node:n, target:tg, value:v, gap:tg-v, rel:(tg-v)/tg});
    });
    return out;
  }

  function plan(){
    var host = document.getElementById("orders"); if(!host) return;
    var projected = total + budget,
        rootW = tree.reduce(function(s,n){return s+(n.weight||0);},0),
        units = buyUnits(tree, projected, []).sort(function(a,b){return b.rel-a.rel;}),
        take = units.slice(0, limit),
        sumGap = take.reduce(function(s,u){return s+u.gap;},0),
        skipped = tree.filter(function(n){ return val(n) >= (n.weight||0)/rootW*projected; }),
        html = "";

    take.forEach(function(u){ u.alloc = sumGap ? budget*u.gap/sumGap : 0; });

    take.forEach(function(u){
      var n = u.node, buy = n.children
        ? n.children.map(function(c){ return shares(u.alloc/c.price) + " × " + c.sym; })
                    .join("  " + (PL.label_or||"or") + "  ")
        : shares(u.alloc/n.price) + " × " + n.sym + " · " + price(n.price);
      html += '<div class="card"><span class="a tnum">'+money(u.alloc)+'</span>'
           +  '<span class="w"><b>'+n.name+'</b><span>'+buy+'</span></span>'
           +  '<span class="g tnum">'+t(PL.label_of_target,{pct:pct0(u.value/u.target*100)})+'</span></div>';
    });
    skipped.forEach(function(n){
      html += '<div class="skip"><span class="a">—</span><b>'+n.name+'</b><span>'+(PL.label_skip||"")+'</span></div>';
    });
    if(!take.length && !skipped.length)
      html = '<div class="skip"><span class="a">—</span><b>'+(PL.label_empty||"")+'</b><span></span></div>';
    host.innerHTML = html;

    // Hold the list at the height it would have at the maximum order count, so dragging the
    // slider never resizes the block. The screen is centred, so a resize would slide the
    // track out from under the pointer.
    var css = getComputedStyle(document.documentElement),
        row = parseFloat(css.getPropertyValue("--row")),
        gap = parseFloat(css.getPropertyValue("--gap")),
        worst = Math.max(1, Math.min(C.max_orders, units.length) + skipped.length);
    host.style.height = (worst * (row + gap)) + "px";
    geom = null;   // screens below this one have just moved

    document.getElementById("totleft").textContent =
      t(PL.label_total, {total: money(total), projected: money(projected)});
    document.getElementById("totright").textContent = take.length
      ? t(PL.label_placed, {sum: money(take.reduce(function(s,u){return s+u.alloc;},0))}) : "";

    runlog(take);   // screen 4 is the receipt for this plan

    var pos = (limit-1)/(C.max_orders-1)*100;
    var tr = document.getElementById("limtrack");
    tr.querySelector("i").style.width = pos+"%";
    tr.querySelector("u").style.left = pos+"%";
    tr.setAttribute("aria-valuenow", limit);
    tr.setAttribute("aria-valuetext", limit + " " +
      (limit===1 ? (PL.label_order||"order") : (PL.label_orders||"orders")));
    document.getElementById("limlabel").textContent =
      limit + " " + (limit===1 ? (PL.label_order||"order") : (PL.label_orders||"orders"));
  }

  /* ---------- run log ---------- */
  // A picture of the run the plan above would produce. The rows are real — quantities rounded
  // down to the tenth of a share the app records, totals to the cent — so nothing here
  // contradicts the app, but the panel is dimmed and cropped: it is there to be recognised as
  // Cola, not read.
  var f_day = null;
  function runDate(){
    if(!f_day){
      try{ f_day = new Intl.DateTimeFormat(L, {day:"numeric", month:"short", year:"2-digit"}); }
      catch(e){ f_day = new Intl.DateTimeFormat("en-GB", {day:"numeric", month:"short", year:"2-digit"}); }
    }
    return f_day.format(new Date());
  }

  function runlog(take){
    var host = document.getElementById("rlrows"); if(!host) return;
    var BL = S.buying || {}, html = "";

    take.forEach(function(u){
      // A shared target is two interchangeable holdings; a run buys one of them, so the log
      // names the one that was bought rather than offering the choice again.
      var n = u.node.children ? u.node.children[0] : u.node,
          qty = Math.floor(u.alloc / n.price * 10) / 10,   // down: a run cannot spend more than it has
          line = Math.round(qty * n.price * 100) / 100;    // a tenth of a share can cost half a cent
      html += '<div class="lrow"><span class="ls">'+n.sym+'</span>'
           +  '<span class="lm"><span class="tnum">'+shares(qty)+'</span><i>×</i>'
           +    '<span class="tnum">'+price(n.price)+'</span>'
           +    '<em>'+u.node.name+'</em></span>'
           +  '<span class="lt tnum">'+money2(line)+'</span></div>';
    });
    host.innerHTML = html;

    // No reserved height: screen 4's content is shorter than the viewport at every order count,
    // so the screen keeps its height either way, and a reserve would leave an empty tail under
    // the last row that pushes the words down for nothing.

    var one = take.length === 1;
    document.getElementById("rlcount").textContent =
      t(one ? (BL.label_logged_one || BL.label_logged) : BL.label_logged, {n: take.length});
    document.getElementById("rldate").textContent = runDate();
  }

  var amount = document.getElementById("amount"), amtbox = document.getElementById("amtbox"),
      amtval = document.getElementById("amtval");
  if(amount){
    // The symbol takes the side and the spacing the locale gives it.
    var cursym = amtval && amtval.querySelector(".cur");
    if(cursym){
      cursym.textContent = SYMBOL;
      if(SYM_FIRST) amtval.insertBefore(cursym, amount);
      if(SYM_TIGHT) amtval.classList.add("tight");
    }

    // The field hugs its contents so the symbol stays beside the number rather than
    // across a fixed gap from it. Counting characters would overshoot, since a grouping
    // mark is narrower than a digit, so an offscreen twin of the text is measured instead.
    var mirror = document.createElement("span");
    mirror.setAttribute("aria-hidden", "true");
    mirror.style.cssText = "position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre";
    amtval.appendChild(mirror);
    function fit(){
      var cs = getComputedStyle(amount);
      ["fontFamily","fontSize","fontWeight","fontStyle","letterSpacing","fontVariantNumeric"]
        .forEach(function(k){ mirror.style[k] = cs[k]; });
      mirror.textContent = amount.value || "0";
      amount.style.width = Math.max(mirror.getBoundingClientRect().width, 8) + "px";
    }
    window.addEventListener("resize", fit);   // the type shrinks on a narrow screen

    // Grouped while at rest, bare digits while being typed into — separators would fight
    // the caret on every keystroke.
    function rest(){ amount.value = f_int.format(budget); fit(); }
    function edit(){ amount.value = String(budget);       fit(); }

    amount.addEventListener("input", function(){
      var n = parseInt(amount.value.replace(/\D/g,""),10);
      budget = isNaN(n) ? 0 : Math.min(n, 9999999);
      fit(); plan();
    });
    amount.addEventListener("focus", function(){ amtbox.classList.add("focus"); edit(); });
    amount.addEventListener("blur",  function(){ amtbox.classList.remove("focus"); rest(); });
    rest();
  }

  /* ---------- the orders slider ---------- */
  var track = document.getElementById("limtrack");
  if(track){
    var notches = "";
    for(var k = 0; k < C.max_orders; k++)
      notches += '<s style="left:'+(k/(C.max_orders-1)*100)+'%"></s>';
    track.insertAdjacentHTML("afterbegin", notches);

    var atX = function(x){
      var r = track.getBoundingClientRect();
      return Math.max(1, Math.min(C.max_orders,
        Math.round((x - r.left) / r.width * (C.max_orders - 1)) + 1));
    };
    var set = function(n){ if(n !== limit){ limit = n; plan(); } };

    track.addEventListener("pointerdown", function(e){
      e.preventDefault();
      track.classList.add("drag");
      track.setPointerCapture(e.pointerId);
      track.focus();
      set(atX(e.clientX));
    });
    track.addEventListener("pointermove", function(e){
      if(track.classList.contains("drag")) set(atX(e.clientX));
    });
    var endDrag = function(){ track.classList.remove("drag"); };
    track.addEventListener("pointerup", endDrag);
    track.addEventListener("pointercancel", endDrag);
    track.addEventListener("lostpointercapture", endDrag);
  }

  /* ---------- deck, with a focus model ---------- */
  // Default: arrows move between screens. A screen carrying a widget is dormant until
  // Return hands the arrows to it, and Escape hands them back. Same Return/Escape pair
  // the app itself uses to enter and leave a group.
  var deck = document.getElementById("deck"),
      screens = Array.prototype.slice.call(document.querySelectorAll(".screen")),
      at = 0, active = null, everOn = {};

  var idOf = function(i){ return screens[i].dataset.screen; };
  // A live screen holds its keys from the start: nothing to activate, nothing to release.
  var isLive = function(id){
    var sc = S[id]; if(!sc) return false;
    return TOUCH ? !!sc.widget : !!sc.live;
  };
  var widgetOf = function(i){ return screens[i].querySelector(".widget"); };
  var cols = function(){ return window.matchMedia("(max-width:560px)").matches ? 1 : 2; };

  function paint(){
    var id = idOf(at), sc = S[id] || {}, on = active === id || isLive(id),
        hs = TOUCH ? (sc.hints_touch && sc.hints_touch.length ? sc.hints_touch : (sc.hints || []))
           : (active === id && sc.hints_active && sc.hints_active.length) ? sc.hints_active
           : (sc.hints || []);

    document.getElementById("hints").innerHTML = hs.map(function(h,i){
      return '<span class="hint'+(i>2?' opt':'')+'" data-k="'+h.key+'"><u>'+h.key+'</u> '+h.label+'</span>';
    }).join("");
    document.getElementById("count").textContent = (at+1) + " / " + screens.length;

    screens.forEach(function(s,i){
      var w = widgetOf(i); if(!w) return;
      var sid = idOf(i), live = isLive(sid), isOn = live || active === sid, meta = S[sid] || {},
          pr = w.querySelector(".prompt"),
          lb = pr && pr.querySelector("span"), kb = pr && pr.querySelector("kbd");
      w.classList.toggle("on", isOn);
      if(TOUCH){
        if(lb) lb.textContent = meta.prompt_touch || meta.prompt || "";
        if(kb) kb.textContent = meta.prompt_kbd_touch || "Tap";
      } else {
        if(lb) lb.textContent = live ? (meta.prompt || "")
                                     : (isOn ? (meta.prompt_active || "") : (meta.prompt || ""));
        if(kb) kb.textContent = live ? (meta.prompt_kbd || "← →") : (isOn ? "Escape" : "Return");
      }

      // one gentle nudge the first time an untouched widget screen is reached
      if(pr){
        var want = !TOUCH && !live && i === at && !isOn && !everOn[sid];
        pr.classList.toggle("pulse", want && MOTION);
      }
    });
    renderTree();
  }

  function activate(){
    if(!widgetOf(at) || isLive(idOf(at))) return;
    active = idOf(at); everOn[active] = true; paint();
  }
  function release(){
    if(!active) return;
    var was = active;
    if(amount) amount.blur();
    active = null;
    if(was === "tree"){ path = []; sel = 0; }   // back to the top level, nothing selected
    paint();
  }

  // Where a screen sits when centred, which is what scroll-snap-align:center settles on.
  // A screen taller than the viewport — the widget screens in a short window — centres too,
  // rather than being pinned to its top edge.
  function restOf(i){
    var top = screens[i].offsetTop - screens[0].offsetTop,
        pos = top + (screens[i].offsetHeight - deck.clientHeight) / 2;
    return Math.max(0, Math.min(deck.scrollHeight - deck.clientHeight, pos));
  }

  // Mandatory snap and a per-frame scrollTop disagree, so snap is suspended for the
  // duration and handed back at the end, on the position it would have chosen anyway.
  var anim = null;
  function glide(to){
    if(anim){ cancelAnimationFrame(anim); anim = null; deck.style.scrollSnapType = ""; }
    var from = deck.scrollTop, d = to - from;
    if(!SCROLL_MS || Math.abs(d) < 2){ deck.scrollTop = to; return; }
    deck.style.scrollSnapType = "none";
    var t0 = performance.now();
    var frame = function(now){
      var p = Math.min(1, (now - t0) / SCROLL_MS);
      deck.scrollTop = from + d * (1 - Math.pow(1 - p, 3));   // ease-out cubic
      if(p < 1){ anim = requestAnimationFrame(frame); return; }
      anim = null; deck.style.scrollSnapType = ""; deck.scrollTop = to;
    };
    anim = requestAnimationFrame(frame);
  }

  function go(i){
    release();
    at = Math.max(0, Math.min(screens.length-1, i));
    glide(restOf(at));
    paint();
  }

  // The screen crossing the middle of the viewport is the active one, read straight from the
  // scroll position. A screen taller than the viewport — which is the ordinary case for the
  // two widget screens on a phone — is active for as long as it covers that middle.
  // Measured once and kept, so the handler below is arithmetic on every scroll event rather
  // than a fresh layout read.
  var geom = null;
  function measure(){
    var t0 = screens[0].offsetTop;
    geom = screens.map(function(s){ return {top:s.offsetTop - t0, h:s.offsetHeight}; });
  }
  window.addEventListener("resize", function(){ geom = null; });

  function activeFromScroll(){
    if(anim) return;                  // a glide knows where it is going; don't guess mid-flight
    if(!geom) measure();
    var mid = deck.scrollTop + deck.clientHeight / 2, best = 0, near = Infinity;
    for(var i = 0; i < geom.length; i++){
      var g = geom[i], d = (mid >= g.top && mid <= g.top + g.h) ? 0 : Math.abs(g.top + g.h/2 - mid);
      if(d < near){ near = d; best = i; }
    }
    if(best !== at){ if(active) release(); at = best; paint(); }
  }
  deck.addEventListener("scroll", activeFromScroll, {passive:true});

  // pointing at a widget hands it the keys too
  renderTabs();
  reserveAll();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(reserveAll);
  window.addEventListener("resize", function(){ reserveAll(); });

  screens.forEach(function(s,i){
    var w = widgetOf(i); if(!w) return;
    w.addEventListener("pointerdown", function(e){
      if(e.target.closest && e.target.closest(".tabs")) return;   // picking a strategy is not engaging the grid
      if(!isLive(idOf(i)) && active !== idOf(i)){ at = i; activate(); }
    });
    var pr = w.querySelector(".prompt");
    if(pr) pr.style.cursor = "default";
  });

  document.addEventListener("keydown", function(e){
    var id = idOf(at);

    // The page claims nothing under Command or Control, so those combinations belong to the
    // browser and are left alone: ⌘← is Back, ⌘R reloads, ⌘L goes to the address bar.
    if(e.metaKey || e.ctrlKey) return;

    // inside the amount field: let text editing have the keys
    if(document.activeElement === amount){
      if(e.key === "Escape" || e.key === "Enter"){ e.preventDefault(); amount.blur(); }
      return;
    }

    if(active === "tree" && id === "tree"){
      var nodes = level(), c = cols(), rows = Math.ceil(nodes.length/c), row = Math.floor(sel/c);
      // Held with Option, the horizontal arrows keep the meaning they have while the screen
      // is dormant — pick a portfolio — so the reader can compare all three without dropping
      // out of the grid. Option rather than Command: ⌘← is Back, and a page has no business
      // taking that. Outside a text field, ⌥← does nothing on macOS.
      if(e.altKey && STRATS.length > 1){
        if(e.key === "ArrowRight"){ e.preventDefault(); setStrategy(strat+1); return; }
        if(e.key === "ArrowLeft" ){ e.preventDefault(); setStrategy(strat-1); return; }
      }
      if(e.key === "ArrowRight"){ e.preventDefault(); sel = Math.min(sel+1, nodes.length-1); renderTree(); return; }
      if(e.key === "ArrowLeft" ){ e.preventDefault(); sel = Math.max(sel-1, 0); renderTree(); return; }
      // The vertical arrows belong to the grid for as long as it is awake, and stop at its
      // edges. Leaving the screen is Escape, then an arrow — a screen change is never a
      // side effect of trying to move a selection.
      if(e.key === "ArrowDown"){
        e.preventDefault();
        if(row < rows-1) { sel = Math.min(sel+c, nodes.length-1); renderTree(); }
        return;
      }
      if(e.key === "ArrowUp"){
        e.preventDefault();
        if(row > 0) { sel = Math.max(sel-c, 0); renderTree(); }
        return;
      }
      if(e.key === "Enter" ){ e.preventDefault(); drill(); return; }
      if(e.key === "Escape"){ e.preventDefault(); if(path.length) up(); else release(); return; }
    }

    // Dormant, the grid has no selection for the horizontal arrows to move, so they pick
    // the strategy instead. Awake, they belong to the grid.
    if(id === "tree" && active !== "tree" && STRATS.length > 1){
      if(e.key === "ArrowRight"){ e.preventDefault(); setStrategy(strat+1); return; }
      if(e.key === "ArrowLeft" ){ e.preventDefault(); setStrategy(strat-1); return; }
    }

    if(id === "plan"){
      if(e.key === "ArrowRight"){ e.preventDefault(); limit = Math.min(limit+1, C.max_orders); plan(); return; }
      if(e.key === "ArrowLeft" ){ e.preventDefault(); limit = Math.max(limit-1, 1); plan(); return; }
      if(e.key === "Enter" && amount){ e.preventDefault(); amount.focus(); amount.select(); return; }
      if(/^[0-9]$/.test(e.key) && amount){ amount.focus(); amount.select(); return; }
    }

    // deck
    if(e.key === "ArrowDown" || e.key === "PageDown"){ e.preventDefault(); go(at+1); return; }
    if(e.key === "ArrowUp"   || e.key === "PageUp"  ){ e.preventDefault(); go(at-1); return; }
    if(e.key === "Enter"){ e.preventDefault(); activate(); return; }
    if(e.key >= "1" && e.key <= String(screens.length)){ e.preventDefault(); go(+e.key-1); return; }
  });

  var dl = document.getElementById("dl");
  if(dl && dl.getAttribute("aria-disabled") === "true")
    dl.addEventListener("click", function(e){ e.preventDefault(); });

  renderTree(); plan(); paint();
})();
</script>
</body>
</html>
